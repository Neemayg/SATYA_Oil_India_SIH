<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SATYA — Schedule-Aligned Truth & Yield Analytics (Oil India Limited)</title>
  <meta name="description" content="SATYA Execution Truth Layer for Oil India Limited SIH 2026. Schedule-aligned field observation reconciliation and evidence-backed actual progress projections.">
  <link rel="stylesheet" href="./css/styles.css?v=1.0.3">
</head>
<body>

  <!-- Header Navigation & Operational Controls -->
  <header class="app-header">
    <div class="brand-container">
      <!-- Inline SVG Logo -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      <div class="brand-title">SATYA</div>
      <div class="brand-subtitle">Execution Truth Layer</div>
      <div id="global-health-pill" class="badge badge-trusted" style="margin-left: 0.5rem;">● API CHECKING</div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="nav-tab active" data-view="control-tower">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Control Tower
      </button>

      <button class="nav-tab" data-view="reconciliation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Reconciliation Desk
      </button>

      <button class="nav-tab" data-view="evidence">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Evidence Center
      </button>

      <button class="nav-tab" data-view="schedule">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Schedule Explorer
      </button>

      <button class="nav-tab" data-view="analytics">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Analytics & Memory
      </button>
    </nav>

    <!-- Dynamic Project Selector Context -->
    <div class="header-controls">
      <label for="global-project-select" style="font-size: 0.75rem; color: var(--text-muted);">Active Project:</label>
      <select id="global-project-select" class="project-select">
        <option value="PRJ-NBG-2026">PRJ-NBG-2026</option>
      </select>
    </div>
  </header>

  <!-- Main View Container Workspace -->
  <main id="view-container" class="main-workspace">
    <!-- Active View Rendered Here -->
  </main>

  <script type="module" src="./js/app.js?v=1.0.3"></script>

</body>
</html>
